# Надстройка для демонстрационного стенда: nginx отдаёт просмотрщик на порту 80 и проксирует API.
# Запуск:  docker-compose -f docker-compose.yml -f deploy/docker-compose.stand.yml up -d --build
# Оцениваемый сервис поднимается без этого файла:  docker-compose up -d --build
version: "3.8"

services:
  web:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./viewer:/usr/share/nginx/html:ro
      - ./data/samples:/usr/share/nginx/data/samples:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
