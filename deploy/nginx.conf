# Витрина демонстрационного стенда: статический просмотрщик + проксирование к сервису.
# Не входит в оцениваемый контур (ТЗ: UI не требуется), основной запуск — docker-compose.yml.
server {
    listen 80;
    server_name _;
    client_max_body_size 4g;   # запас над 3 ГБ из ТЗ: витрина не должна быть узким местом

    root /usr/share/nginx/html;
    index index.html;

    # образцы данных больше не раздаются веб-сервером: они уходят через /api/samples,
    # где действуют те же правила доступа, что и на расчёт

    # большие тестовые наборы для проверки производительности (не входят в оцениваемый контур)
    location /files/ {
        alias /usr/share/nginx/files/;
        autoindex on;
        add_header Content-Type "application/geo+json";
        add_header Content-Disposition "attachment";
    }

    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /swagger-ui/ { proxy_pass http://app:8080/swagger-ui/; }
    location = /swagger-ui.html { proxy_pass http://app:8080/swagger-ui.html; }
    location /v3/api-docs { proxy_pass http://app:8080/v3/api-docs; }
}
