# ТП §3 и Q&A 16.09: при превышении предельной длины допускается поднять ДУ на одну ступень, не более
length_limit:
  allow_upsize_steps: 1

# ТП §8.2: тепловые камеры и врезки
chambers:
  max_branches: 4                        # к камере ≤4 участка: 1 к источнику + ≤3
  existing_chamber_tie_in_radius_m: 10   # врезка ≤10 м от существующей камеры → в камеру
  cost_by_max_dn:                        # одна шкала для новой камеры и реконструкции существующей
    - {max_dn: 200,  cost: 3000000}
    - {max_dn: 500,  cost: 5000000}
    - {max_dn: 1000, cost: 8000000}
    - {max_dn: 1400, cost: 12000000}
tie_in:
  cost: 5000000                          # каждая независимая врезка, не зависит от ДУ

# ТП §8.3: штраф за неподключённый ОКС = fixed + per_tph × G
unconnected_penalty:
  fixed: 100000000
  per_tph: 500000

# ТП §9: S = cost_weight·(C / cost_base) + length_weight·(L / length_base)
ranking:
  cost_weight: 0.7
  cost_base: 25000000
  length_weight: 0.3
  length_base: 100

# ТП §6, приложение по глубине (дополнительная задача)
depth:
  normal_top_depth_m: 3.0
  min_top_depth_m: 0.7
  max_slope: 0.10                        # м/м: на 1 м глубины ≥10 м по горизонтали
  plateau_half_length_m: 2.0             # полка по 2 м с каждой стороны точки пересечения
  extra_cost_per_m_depth: 0.10           # Kгл = 1 + 0.10·(h − 3) при h > 3
  free_depth_m: 3.0
  step_m: 0.5                            # ТЗ 2.13; в актуальном ТП шага нет — используется только для перебора
  max_top_depth_m: 10.0                  # предельная глубина поиска (параметр, приложение к ТЗ п. 4.2)

# ТП §4.3: условные габариты существующих линейных объектов (для доп. задачи)
existing_utilities:
  gas_pipeline: {width_m: 0.400, height_m: 0.400, top_depth_m: 2.8}
  power_cable:  {width_m: 0.200, height_m: 0.200, top_depth_m: 2.7}
  heat_network: {top_depth_m: 3.0}       # габарит по ДУ из табл. 4.2

# Точка расширения: ставки платы за подключение (приказы ДЭПиР для ПАО «МОЭК») дифференцируются по диапазонам
# диаметров и типу прокладки — подземная канальная, бесканальная, надземная. В кейсе базовый способ —
# бесканальный (ТЗ 2.2), поэтому коэффициент 1.0; для канальной/надземной прокладки добавьте множитель к cнов(ДУ).
laying_cost_factors:
  underground_ductless: 1.0     # бесканальная — базовая (ТЗ 2.2, ТП §3)
  underground_channel: 1.0      # канальная — задать по ставкам ДЭПиР при использовании
  overground: 1.0               # надземная — в кейсе не рассматривается

# Q&A 16.09: нестандартный угол поворота (не 45°/90°) — удорожание ×1.5; трассировка на
# 8-направленной сетке нестандартных углов не создаёт, коэффициент оставлен для полноты
nonstandard_angle_cost_factor: 1.5
