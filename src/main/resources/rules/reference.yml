# Справочные параметры расчёта. Источник — Техническое приложение к кейсу (ТП), ЛЦТ 2026.
# Файл редактируется без перекомпиляции: положите свою копию в каталог HEATNET_RULES.

crs:
  input: "EPSG:4326"        # ТП §2: вход и выход в WGS 84
  calc_proj4: "+proj=utm +zone=37 +datum=WGS84 +units=m +no_defs"   # EPSG:32637, все длины/буферы

