# Правила учёта пространственных ограничений по типу restriction_type.
# Источник: техническое приложение от 21.09.2026, таблица 2, и «Разъяснения по вопросам ЛЦТ». Редактируется экспертом.
#
# rule: forbidden — пересечение запрещено, обход с отступом clearance
#       special   — допускается специальный проход (участок laying_method=special, стоимость × k_special)
# geometry: polygon — расстояние от внешней границы полигона
#           line    — входная геометрия считается осью, расстояние между внешними границами габаритов
# clearance_m / clearance_by_dn — минимальное горизонтальное расстояние (для ОКС зависит от ДУ новой сети)
# min_crossing_angle_deg — минимальный угол пересечения к оси препятствия (ось строится сервисом)
# zone_margin_m — границы спецучастка: полигон + margin с каждой стороны (polygon) или ±margin от точки (line)
# depth — правило по глубине для доп. задачи
# При наложении нескольких спецзон применяется один спецучасток и максимальный k_special (Q&A).

default_rule: forbidden          # неизвестный тип ограничения → обходим (безопасное допущение) + предупреждение
default_clearance_m: 1.0

types:
  oks:
    title: "Существующий или перспективный ОКС"
    rule: forbidden
    geometry: polygon
    clearance_by_dn:            # 5 м при ДУ < 500; 7 м при 500–800; 9 м при ≥ 900
      - {max_dn: 499,  m: 5.0}
      - {max_dn: 800,  m: 7.0}
      - {max_dn: 1400, m: 9.0}
    source: "ТП от 21.09.2026, табл. 2"
  oks_existing:
    alias_of: oks
  oks_future:
    alias_of: oks
  park:
    title: "Парк"
    rule: forbidden
    geometry: polygon
    clearance_m: 1.0
    source: "ТП от 21.09.2026, табл. 2"
  social_area:
    title: "Территория социального объекта"
    rule: forbidden
    geometry: polygon
    clearance_m: 1.0
    source: "ТП от 21.09.2026, табл. 2"
  prohibited_site:
    title: "Запрещённая территория"
    rule: forbidden
    geometry: polygon
    clearance_m: 1.0
    source: "ТП от 21.09.2026, табл. 2"
  water:
    title: "Водный объект"
    rule: forbidden
    geometry: polygon
    clearance_m: 1.0
    source: "ТП от 21.09.2026, табл. 2"
  road:
    title: "Автомобильная дорога"
    rule: special
    geometry: polygon
    clearance_m: 1.5
    min_crossing_angle_deg: 45
    zone_margin_m: 3.0
    k_special: 1.60
    depth: {position: below, min_top_depth_m: 1.0}
    source: "ТП от 21.09.2026, табл. 2"
  tram_tracks:
    title: "Трамвайные пути"
    rule: special
    geometry: polygon
    clearance_m: 1.5
    min_crossing_angle_deg: 45
    zone_margin_m: 3.0
    k_special: 1.75
    depth: {position: below, min_top_depth_m: 1.2}
    source: "ТП от 21.09.2026, табл. 2"
  railway:
    title: "Железная дорога"
    rule: forbidden
    geometry: polygon
    clearance_m: 1.0
    source: "ТП от 21.09.2026, табл. 2: пересечение запрещено, минимальное расстояние 1,0 м.
      В отраслевых нормах пересечение железной дороги допускается — СП 124.13330.2012 п. 9.11
      (как правило надземно, подземно в канале, футляре или тоннеле, угол не менее 60°),
      СП 227.1326000.2014 (пересечения железнодорожных линий с инженерными сетями),
      СП 74.13330.2023 (производство работ, 100 % контроль сварных швов на пересечении),
      СП 315.1325800.2017 (бесканальная прокладка под железной дорогой не допускается).
      Приложение эту возможность не описывает, поэтому по умолчанию принят запрет; для расчёта
      по отраслевым нормам достаточно заменить rule на special и задать min_crossing_angle_deg: 60"
  gas_pipeline:
    title: "Газопровод"
    rule: special
    geometry: line
    clearance_m: 2.0
    zone_margin_m: 2.0
    k_special: 1.25
    depth: {position: any, min_vertical_clearance_m: 0.2}
    source: "ТП от 21.09.2026, табл. 2"
  power_cable:
    title: "Силовой кабель до 35 кВ"
    rule: special
    geometry: line
    clearance_m: 2.0
    zone_margin_m: 2.0
    k_special: 1.15
    depth: {position: any, min_vertical_clearance_m: 0.5}
    source: "ТП от 21.09.2026, табл. 2"
  heat_network:
    title: "Существующая тепловая сеть (независимое пересечение без врезки)"
    rule: special
    geometry: line
    clearance_m: 1.0
    zone_margin_m: 2.0
    k_special: 1.05
    depth: {position: any, min_vertical_clearance_m: 0.5}
    source: "ТП от 21.09.2026, табл. 2"
