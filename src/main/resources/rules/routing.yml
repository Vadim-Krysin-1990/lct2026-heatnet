# Параметры алгоритма трассировки. Не являются нормативными — подбираются под качество трассы.

grid_step_m: 2.0              # шаг растровой сетки в окне поиска; повороты только на 45°/90°
turn_penalty_m: 12.0          # штраф за поворот на 45° в «метрах стоимости» (90° = двойной); минимизация поворотов (Q&A)
orthogonal_turn_penalty_m: 14.0  # базовый штраф поворота для инженерных вариантов (за прямой угол)
sharp_turn_factor: 10.0        # во сколько раз дороже поворот на 45°: внутренний угол 135° самокомпенсации не даёт
                              # и требует неподвижных опор, поэтому косой излом для тепловой сети хуже прямого угла
clearance_dn_headroom_steps: 1   # запас по ДУ при построении отступов: ДУ ствола может подняться из-за предельной длины
visibility_vertex_offset_m: 0.35   # вынос вершины графа наружу от угла зоны: ближе граница «задевается» проверкой видимости
visibility_max_vertices: 260       # предел вершин графа: дальше квадратичный рост проверок видимости
max_turn_deg: 90.0            # ТП §2.1: повороты трассы круче 90° запрещены
free_angle_turn_penalty_m: 2.0   # штраф поворота для спрямляемых вариантов: ищем кратчайший путь, изломы снимает спрямление
grid_bearing_deg:             # азимут сетки; пусто — определяется по преобладающему направлению существующей сети
window_margin_m: 80.0         # запас окна поиска вокруг {точка ОКС, кандидаты врезки}
candidate_radius_m: 700.0     # радиус поиска кандидатов врезки (аналог радиуса эффективного теплоснабжения, РЭТ, из схемы теплоснабжения: распределительные сети 250–1000 м); при отсутствии кандидатов удваивается до max
candidate_radius_max_m: 5000.0   # предел поиска (транзитные сети до 5 км); дальше — «маршрут не найден», т.е. отсутствие технической возможности по коридорам
max_candidates: 6             # сколько кандидатов врезки перебирать на точку
max_exit_candidates: 8        # сколько направлений выхода из здания перебирать (ближние стороны, ±45°, затем через буфер соседа)
line_zone_min_angle_deg: 45.0   # для линейных объектов (газ, кабель, теплосеть) ТП угол не задаёт; 45° исключает прокладку вдоль объекта внутри зоны и соответствует минимуму СП 124.13330
snap_tolerance_m: 0.5         # допуск совпадения концов участков при восстановлении топологии сети
alt_tie_in_exclusion_radius_m: 30.0   # вариант «другие врезки»: исключить объекты сети в этом радиусе от врезок варианта 1
despike_max_m: 2.0            # длина «шпильки» (микроизлом с поворотом круче 90° на стыке коридора выхода и растрового пути), которая снимается при сборке трассы
turn_margin_deg: 0.0          # запас при срезке углов ниже предела 90°
visibility_spike_max_m: 10.0
chamber_merge_radius_m: 60.0  # ближе этого расстояния две тепловые камеры считаются одним узлом и сводятся
branch_on_segment_cost_factor: 1.0  # во сколько раз ветвление посреди участка дороже оценки по расходу точки
tie_in_penalty_rub: 0         # надбавка за присоединение к существующей сети: ведёт ветви к общему стволу
# ТП §2.8 разрешает «до трёх» вариантов, поэтому конкурсная выдача — три. Для демонстрации
# и сравнения методов параметр запроса variants=N отдаёт больше: тогда видны обе категории целиком.
max_variants: 3
# Состав выдачи по категориям: в ней обязательно есть и инженерная трассировка, и минимальная
# по расчёту — заказчик видит цену «красивой» геометрии и решает сам.
engineering_variants_in_output: 2     # инженерные: длинные прямые вдоль застройки, прямые углы
shortest_variants_in_output: 2        # минимальные по расчёту: лучший показатель S
orthogonal_variants_in_output: 1      # устаревшее имя, оставлено для совместимости
# Второй метод (граф видимости) по умолчанию не включается в конкурсную выдачу: на конкурсном
# наборе он пока уступает растровому поиску и даёт единичные нарушения геометрии, которые
# ловит tools/validate_result.py. Метод реализован и работает — включается значением 1,
# стратегии ниже раскомментируются.
visibility_variants_in_output: 0
free_angle_variants_in_output: 2      # сколько спрямлённых вариантов обязательно попадает в выдачу (ТП от 21.09 разрешает любой угол до 90°)
strategies:                   # считаются все; в выдачу идут инженерные, порядок (rank) — по показателю S (ТП §9)
  - orthogonal_city           # инженерная: геометрия вдоль застройки, раздельные врезки у ближних точек
  - orthogonal_alt_tie_in     # инженерная: ствол от крупных потребителей, другие точки врезки
  - orthogonal_shared         # инженерная: общая сеть, ветвления в камерах, минимум врезок
  - free_angle_shared         # спрямление произвольным углом: кратчайшая трасса, геометрия дальше от инженерной практики
  - free_angle_separate       # спрямление произвольным углом, раздельные врезки у ближних точек
  - free_angle_merged         # то же спрямление с объединением близких камер: камера — самая дорогая позиция сметы
  - orthogonal_merged         # инженерная геометрия с объединением близких камер
  - visibility_shared         # второй метод: граф видимости по углам препятствий (см. docs/algorithm.md 3а)
  - visibility_separate       # граф видимости, раздельные врезки
  - shared_tree               # контрольная альтернатива с косыми изломами (в выдачу не идёт, видна в диагностике)
  - separate_parts            # контрольная альтернатива с косыми изломами
