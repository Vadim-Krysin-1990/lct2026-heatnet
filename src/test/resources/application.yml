spring:
  datasource:
    url: jdbc:h2:mem:heatnet;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
heatnet:
  storage-dir: target/heatnet-storage
  workers: 1
